name: Publish API Documentation

on:
  push:
    paths:
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate exported documentation
        run: |
          test -s docs-site/index.html
          test -s docs-site/assets/swagger-ui.css
          test -s docs-site/assets/swagger-ui-bundle.js
          test -s docs-site/assets/LICENSE.swagger-ui
          test -s docs-site/assets/swagger-ui-bundle.js.LICENSE.txt
          python -m json.tool docs-site/openapi.json > /dev/null
          node --check docs-site/swagger.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
