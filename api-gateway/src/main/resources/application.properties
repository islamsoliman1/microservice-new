spring.application.name=api-gateway
server.port=8089

# Eureka
eureka.client.service-url.defaultZone=http://eureka:password@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO

# Eureka UI base URL (overridden in Docker via DISCOVERY_URL)
discovery.url=${DISCOVERY_URL:http://localhost:8761}

# =========================
# Product Service
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/product,/api/product/**

# =========================
# Order Service
# =========================
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/order/**

# =========================
# Eureka Web UI
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=discovery-server
spring.cloud.gateway.server.webflux.routes[2].uri=${discovery.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/

# =========================
# Eureka Static Resources
# =========================
spring.cloud.gateway.server.webflux.routes[3].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[3].uri=${discovery.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/eureka/**

# =========================
# Keycloak (Docker overrides this via env vars)
# =========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18085/realms/spring-boot-microservice-realm


